
services:

  backend:
    build:
      context: ./MyService
    image: travelbook-backend
    container_name: travelbook-backend
    ports:
      - "8080:8080"
    environment:

      DATABASE_URL: ${DATABASE_URL:-jdbc:h2:mem:testdb}
      DATABASE_USER: ${DATABASE_USER:-sa}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-}
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - travelbook-net

  front:
    build:
      context: ./front
    image: travelbook-front
    container_name: travelbook-front
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - travelbook-net

networks:
  travelbook-net:
    driver: bridge
